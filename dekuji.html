<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Děkuji — Jakub Kresta</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <meta name="description" content="Děkuji za zpětnou vazbu" />
  <style>
    .thank-you-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .thank-you-message {
      font-size: 3rem;
      font-weight: 700;
      color: var(--accent);
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    @media (max-width: 768px) {
      .thank-you-message {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="thank-you-container">
    <h1 class="thank-you-message">Děkuji za zpětnou vazbu</h1>
  </div>
</body>
</html>
