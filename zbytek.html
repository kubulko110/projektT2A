<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jakub Kresta — Zbytek</title>
  <link rel="stylesheet" href="uvod.css">
  <meta name="description" content="Ostatní věci" />
</head>
<body>

<div class="app">

  <!-- TOPBAR -->
  <header class="topbar">
    <button class="toggle-sidebar" aria-label="Přepnout postranní panel">☰</button>
    <div class="topbar-title">Jakub Kresta</div>
  </header>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">Rychlá pomůcka</div>
    <nav>
      <ul>
        <li><a href="úvodní stránka.html">Domů</a></li>
        <li><a href="o me.html">O mně</a></li>
        <li><a href="zajmy.html">Zájmy a koníčky</a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">verze 1.0</div>
  </aside>

  <!-- OBSAH -->
  <main class="content">

    <!-- HERO -->
    <section class="hero">
      <h2>Zbytek</h2>
      <p>Věci a stránky, které se nezařadily do hlavních kategorií.</p>
    </section>

    <!-- KARTY -->
    <section class="cards">

      <a href="o me.html" class="card">
        <img src="assets/images/o_me.jpg" alt="O mně">
        <h4>O mně</h4>
        <p>Informace o mně a kontakty</p>
      </a>

      <a href="citaty.html" class="card">
        <img src="assets/images/citaty.jpg" alt="Citáty">
        <h4>Citáty</h4>
        <p>Oblíbené citáty a výroky</p>
      </a>

      <a href="hudba.html" class="card">
        <img src="assets/images/hudba.jpg" alt="Hudba">
        <h4>Hudba</h4>
        <p>Moje hudební vkusy</p>
      </a>

      <a href="postavy.html" class="card">
        <img src="assets/images/oblíbené postavy.png" alt="Postavy">
        <h4>Postavy</h4>
        <p>Moje oblíbené postavy</p>
      </a>

    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer">© 2025 Jakub Kresta</footer>

</div>

<script>
  (function(){
    const btn = document.querySelector('.toggle-sidebar');
    const sidebar = document.getElementById('sidebar');
    btn.addEventListener('click', ()=> sidebar.classList.toggle('collapsed'));
    document.querySelectorAll('.sidebar a')
      .forEach(a=> a.addEventListener('click', ()=> sidebar.classList.add('collapsed')));
  })();

  (function(){ try{ localStorage.setItem('visited_zbytek','1'); }catch(e){} })();

  // === ADD QUIZ TO SIDEBAR DYNAMICALLY ===
  (function() {
    const requiredPages = [
      'visited_o_me', 'visited_zajmy', 'visited_anime', 'visited_gaming',
      'visited_historie', 'visited_zbytek', 'visited_citaty', 'visited_hudba', 'visited_autor'
    ];
    const allVisited = requiredPages.every(p => localStorage.getItem(p));
    
    if (allVisited) {
      const nav = document.querySelector('.sidebar nav ul');
      const existingQuizLink = nav.querySelector('li a[href="kviz.html"]');
      if (!existingQuizLink) {
        const li = document.createElement('li');
        li.innerHTML = '<a href="kviz.html">Kvíz o mně 🎉</a>';
        nav.appendChild(li);
      }
    }
  })();
</script>

</body>
</html>
