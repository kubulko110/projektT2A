<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Autor — Jakub Kresta</title>
  <link rel="stylesheet" href="uvod.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="toggle-sidebar" aria-label="Přepnout postranní panel">☰</button>
      <div class="topbar-title">Autor</div>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="brand">Rychlá pomůcka</div>
      <nav>
        <ul>
          <li><a href="úvodní stránka.html">Domů</a></li>
          <li><a href="o me.html">O mně</a></li>
          <li><a href="zajmy.html">Zájmy a koníčky</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">verze 1.0</div>
    </aside>

    <main class="content">
      <section class="hero">
        <h2>O autorovi</h2>
        <p>Tady bude stručná informace o autorovi a kontakty.</p>
      </section>

      <section class="panel">
        <h3>Kontakt</h3>
        <div style="display:flex;gap:12px;align-items:center">
          <img src="https://avatars.dicebear.com/api/identicon/author.svg" alt="Autor" style="width:120px;height:120px;border-radius:10px">
          <div>
            <p><strong>Jakub Kresta</strong></p>
            <p>Email: <a href="mailto:example@example.com">example@example.com</a></p>
            <p>Sociální sítě:</p>
            <ul>
              <li><a href="#">Instagram</a></li>
              <li><a href="#">Twitter</a></li>
              <li><a href="#">GitHub</a></li>
            </ul>
          </div>
        </div>
      </section>

    </main>

    <footer class="footer">© 2025 Jakub Kresta</footer>
  </div>

  <script>
    (function(){
      const btn = document.querySelector('.toggle-sidebar');
      const sidebar = document.getElementById('sidebar');
      btn.addEventListener('click', ()=> sidebar.classList.toggle('collapsed'));
      document.querySelectorAll('.sidebar a').forEach(a=> a.addEventListener('click', ()=> sidebar.classList.add('collapsed')));
    })();
      (function(){ try{ localStorage.setItem('visited_autor','1'); }catch(e){} })();
  </script>
</body>
</html>
